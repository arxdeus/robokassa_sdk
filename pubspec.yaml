name: robokassa_sdk
description: >-
  Robokassa payments for Flutter — signature generation, payment links, fiscal
  receipts, server callback verification, and the full native 3-D Secure
  checkout flow via the official Robokassa Android and iOS SDKs.
version: 0.1.0
homepage: https://github.com/robokassa/sdk-flutter
repository: https://github.com/robokassa/sdk-flutter
issue_tracker: https://github.com/robokassa/sdk-flutter/issues
documentation: https://docs.robokassa.ru/

topics:
  - payments
  - robokassa
  - ecommerce
  - fiscal

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  crypto: ^3.0.6
  http: ^1.2.2
  xml: ^6.5.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: ru.robokassa.robokassa_sdk
        pluginClass: RobokassaSdkPlugin
      ios:
        pluginClass: RobokassaSdkPlugin
