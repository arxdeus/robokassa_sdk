include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Pigeon output; regenerate with `dart run pigeon --input pigeons/messages.dart`.
    - lib/src/platform/messages.g.dart
    - test/platform/test_api.g.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # A payments SDK is read far more than it is written, and a wrong
    # assumption here costs real money — so every public member is documented
    # and the analyzer enforces it.
    - public_member_api_docs
    - always_declare_return_types
    - avoid_dynamic_calls
    - cast_nullable_to_non_nullable
    - comment_references
    - directives_ordering
    - noop_primitive_operations
    - only_throw_errors
    - prefer_final_locals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_string_buffers

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
